services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: trade_surveillance_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: trade_surveillance_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  neo4j:
    image: neo4j:5.15-community
    container_name: trade_surveillance_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/surveillance123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_dbms_security_http__access__control__allow__origin: "*"

  neo4j-preview:
    image: nginx:alpine
    container_name: trade_surveillance_neo4j_preview
    depends_on:
      - neo4j
    ports:
      - "7475:7475"
    volumes:
      - ./neo4j-preview-proxy.conf:/etc/nginx/conf.d/default.conf:ro
