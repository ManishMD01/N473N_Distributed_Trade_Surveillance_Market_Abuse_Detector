version: '3.8'

services:
  # ==========================================
  # Zookeeper: Required coordination service for Apache Kafka
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: trade_surveillance_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - surveillance_net
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Apache Kafka: High-throughput streaming backbone for L3 order book ingestion
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: trade_surveillance_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN INSYNC_REPLICAS: 1
    networks:
      - surveillance_net
    healthcheck:
      test: ["CMD", "kafka-broker-api-bridge", "health", "check", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # Neo4j Graph Database (Community Edition 5.x)
  # Pre-configured with APOC plugins for advanced graph analytics
  # ==========================================
  neo4j:
    image: neo4j:5-community
    container_name: trade_surveillance_neo4j
    ports:
      - "7474:7474"   # HTTP Browser / Cypher interface
      - "7687:7687"   # Bolt protocol for driver connections
    environment:
      # Set initial credentials for the neo4j user
      NEO4J_AUTH: neo4j/surveillance123
      # Enable APOC core procedures
      NEO4J_PLUGINS: '["apoc"]'
      # Configure APOC to download from the official release repository
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      # Unrestricted procedure execution for graph algorithms and data integration
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      # Allow APOC to read/write files for graph loading and unmanaged procedures
      NEO4J_dbms_directories_import: "/var/lib/neo4j/import"
      NEO4J_dbms_directories_plugins: "/var/lib/neo4j/plugins"
      NEO4J_dbms_memory_heap_initial_size: "2G"
      NEO4J_dbms_memory_heap_max_size: "4G"
      NEO4J_dbms_memory_pagecache_size: "2G"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/var/lib/neo4j/plugins
    networks:
      - surveillance_net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "surveillance123", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 20

# ==========================================
# Volumes: Persistent storage for Kafka and Neo4j state
# ==========================================
volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

# ==========================================
# Networks: Isolated Docker network for secure internal communications
# ==========================================
networks:
  surveillance_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16